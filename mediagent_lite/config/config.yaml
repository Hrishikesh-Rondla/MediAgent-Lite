# MediAgent-Lite Configuration
# All tunable parameters live here. Weights, thresholds, model assignments.

# ── LLM Role Assignments ────────────────────────────────────────────────────
# Each agent can use a different model. This is a key teaching point:
# different tasks benefit from different model capabilities.
llm_roles:
  default:
    provider: gemini
    model: gemini-1.5-flash
    temperature: 0.0  # deterministic for reproducibility

  clarifier:
    provider: gemini
    model: gemini-1.5-flash
    temperature: 0.0
    # Why Gemini Flash: excellent structured-output/JSON extraction,
    # high free-tier quota (1500 req/day), fast.

  rag_analyzer:
    provider: gemini
    model: gemini-1.5-flash
    temperature: 0.1
    # Why slight temperature: allows ranking variation while staying grounded.

  evidence_scanner:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.0
    # Why Groq: EvidenceScanner runs in parallel per hypothesis.
    # Groq's speed (300+ tok/s) prevents this from becoming a bottleneck.

  fusion:
    provider: gemini
    model: gemini-1.5-pro
    temperature: 0.0
    # Why Pro: conflict detection and cross-source reasoning needs
    # the strongest model. Only one call per case, so cost is acceptable.

  optimizer:
    provider: groq
    model: llama-3.1-8b-instant
    temperature: 0.3
    # Why 8b instant: query rewriting is lightweight. Fast + free quota.
    # Temperature 0.3: we WANT paraphrase variation to avoid repeating queries.

  medqa_adapter:
    provider: gemini
    model: gemini-1.5-flash
    temperature: 0.0

  fake:
    provider: fake
    model: fake
    temperature: 0.0

# ── RAG Parameters ──────────────────────────────────────────────────────────
rag:
  top_k: 5                        # number of chunks to retrieve
  similarity_threshold: 0.45      # primary cosine similarity cutoff
  fallback_threshold: 0.30        # threshold for fallback step 2
  chunk_size: 512
  chunk_overlap: 64
  embedding_model: pritamdeka/BioBERT-mnli-snli-scinli-scitail-mednli-stsb
  embedding_dim: 768
  collection_name: mediagent_corpus
  qdrant_path: ./qdrant_storage

  # Medical term boosting: repeat high-priority terms N times in the query
  # This can be toggled off for ablation G.
  term_boosting:
    enabled: true
    boost_factor: 2  # repeat top symptoms N times
    # Terms identified as high-priority by TF-IDF rank in the query
    top_n_terms: 3

# ── Confidence Formula ──────────────────────────────────────────────────────
# confidence = w1*retrieval_similarity + w2*weighted_evidence_score + w3*concordance
# Weights must sum to 1.0. Tuned on dev split, never on test split.
confidence:
  w1: 0.35  # retrieval similarity weight
  w2: 0.40  # evidence quality weight
  w3: 0.25  # concordance weight
  tau: 0.65  # confidence threshold for feedback loop

# ── Evidence Hierarchy Weights ───────────────────────────────────────────────
# Reflects Oxford CEBM levels of evidence, simplified.
evidence_weights:
  guideline: 1.0
  systematic_review: 0.9
  meta_analysis: 0.9
  rct: 0.8
  cohort: 0.6
  case_control: 0.6
  case_report: 0.3
  other: 0.2

# ── Adaptive Optimizer ──────────────────────────────────────────────────────
optimizer:
  max_iter: 3
  tau: 0.65  # same as confidence.tau (duplicated here for clarity)

# ── PubMed / Web Evidence ───────────────────────────────────────────────────
pubmed:
  max_results_per_query: 5
  cache_dir: ./data/pubmed_cache
  retmax: 5
  rate_limit_delay: 0.34  # seconds between requests (3 req/s for NCBI without API key)
  max_retries: 3

# ── Ingestion ───────────────────────────────────────────────────────────────
ingestion:
  pubmed_queries:
    - "chest pain differential diagnosis"
    - "dyspnea differential diagnosis"
    - "headache differential diagnosis emergency"
    - "abdominal pain diagnosis"
    - "fever workup diagnosis"
    - "hypertension management guidelines"
    - "diabetes mellitus type 2 diagnosis"
    - "pneumonia diagnosis treatment"
    - "myocardial infarction acute diagnosis"
    - "sepsis diagnosis criteria"
    - "appendicitis diagnosis"
    - "pulmonary embolism diagnosis"
    - "stroke acute diagnosis"
    - "kidney failure diagnosis"
    - "anemia diagnosis workup"
    - "thyroid disorder diagnosis"
    - "anxiety depression diagnosis"
    - "urinary tract infection diagnosis"
    - "asthma COPD differential"
    - "meningitis diagnosis"
  max_abstracts_per_query: 15  # ~300 abstracts total
  hf_dataset: dux-tecblic/symptom-disease-dataset
  hf_split: train
  hf_max_rows: 500

# ── Evaluation ──────────────────────────────────────────────────────────────
eval:
  dataset: GBaker/MedQA-USMLE-4-options
  n_questions: 100
  seed: 42
  dev_fraction: 0.2  # 20 questions for threshold/weight tuning
  results_dir: ./results
  cache_dir: ./data/eval_cache
